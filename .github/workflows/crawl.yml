# 브랜드 하나를 처음부터 수집한다 — 씨앗에는 있는데 상품이 0인 매장을 살리려고 만들었다.
# 기존 워크플로는 전부 「이미 있는 상품」을 갱신하는 것이라, 새 매장을 들일 길이 없었다.
# 필요한 것: Settings → Secrets and variables → Actions 에 DATA_TOKEN.
name: crawl-brand

on:
  workflow_dispatch:
    inputs:
      brands:
        description: "공백으로 나눈 slug 목록 (예: opus-0012 pog-service)"
        required: true
      workers:
        description: "동시에 볼 매장 수 — 한 매장에는 언제나 초당 하나만 간다"
        required: false
        default: "2"
      refresh:
        description: "true 면 그 매장 파일을 비우고 새로 받는다"
        required: false
        default: "false"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DATA_BRANCH: crawl/cafe24-full-catalog
    steps:
      - uses: actions/checkout@v4
      - name: 데이터 저장소(비공개) 받기
        uses: ./.github/actions/data-repo
        with: {token: "${{ secrets.DATA_TOKEN }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q requests beautifulsoup4 lxml
      - name: 수집
        working-directory: work
        run: |
          python scripts/crawl_cafe24.py --brands ${{ inputs.brands }} \
            --workers ${{ inputs.workers }} \
            ${{ inputs.refresh == 'true' && '--refresh' || '' }} | tail -40
      # 원본(jsonl)을 먼저 민다. 매장마다 파일이 따로라 겹칠 일이 없다.
      - name: 원본 밀기
        working-directory: work
        shell: bash
        run: |
          git config user.name "layer-crawl-bot"
          git config user.email "crawl@layer.invalid"
          git add data/crawl/
          git diff --cached --quiet && { echo "새 원본 없음"; exit 0; }
          git commit -m "새 매장 수집 $(date -u +%Y-%m-%d) — ${{ inputs.brands }} (Actions)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$DATA_BRANCH" && git push && exit 0
            # 매장별 jsonl 은 서로 겹칠 일이 없지만, 판마다 통째로 다시 쓰는 보고 파일
            # (_summary.json · _members_only.json)은 동시에 돌면 반드시 부딪힌다.
            # 그것 때문에 이번 수집을 버릴 이유가 없다 — 저쪽 것을 받고 이어간다.
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              for f in $(git diff --name-only --diff-filter=U | grep -E '^data/crawl/_[^/]*\.json$' || true); do
                git checkout --ours -- "$f" && git add "$f"
              done
              if [ -z "$(git diff --name-only --diff-filter=U)" ]; then
                git -c core.editor=true rebase --continue && git push && exit 0
              fi
              git rebase --abort 2>/dev/null || true
            fi
            echo "원본 푸시 실패, 재시도 $i"; sleep 10
          done
          exit 1
      # 생성물은 원본에서 다시 만들면 그만이라, 부딪히면 저쪽 것을 버리고 새로 만든다.
      - name: CSV · 사이즈 · 태그 재생성해 밀기
        working-directory: work
        shell: bash
        run: |
          build() {
            # 그림에서 읽어 둔 글을 먼저 뽑는다 — build-csv 가 「보여 줄 설명이 있나」를
            # 여기 결과로 가린다(2026-09-20). 앞서는 이걸 ocr 판에서만 돌려서, OCR 은
            # 189곳을 읽어 뒀는데 뽑아 둔 것은 121곳뿐이었다.
            python scripts/detail_from_ocr.py | tail -3
            python scripts/crawl_cafe24.py --build-csv | tail -3
            python scripts/size_from_ocr.py | tail -4
            python scripts/tag_items.py | tail -3
          }
          for i in 1 2 3; do
            build
            git add data/products_full.csv data/product_sizes.json data/product_tags_full.json data/crawl/detail
            git diff --cached --quiet && { echo "변화 없음"; exit 0; }
            git commit -m "생성물 재생성 $(date -u +%Y-%m-%d) (Actions)"
            git push && exit 0
            echo "생성물 푸시 실패, 재시도 $i — 남의 것을 받아 다시 만든다"
            git fetch origin "$DATA_BRANCH"
            git reset --hard "origin/$DATA_BRANCH"
            sleep 10
          done
          exit 1
