# 비슷한 옷(v3)만 다시 만든다 — 상품마다 40벌 · 점수. rebuild · weekly 에도 같은 단계가 있지만
# 설정값만 바꿨을 때 1.5시간짜리 재생성을 돌리지 않으려고 따로 둔다(2026-10-05). 10분 · 3GB.
name: similar
on:
  workflow_dispatch:
concurrency:
  group: data-generated
  cancel-in-progress: false
jobs:
  similar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run: {working-directory: work}
    steps:
      - uses: actions/checkout@v4
      - name: 데이터 저장소(비공개) 받기
        uses: ./.github/actions/data-repo
        with: {token: "${{ secrets.DATA_TOKEN }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q requests beautifulsoup4 lxml numpy scipy   # build_vocab 을 import 하므로 크롤러 의존성도 필요
      - name: 비슷한 옷 계산
        run: python scripts/similar_items.py | tail -5
      - name: commit & push (rebase 후, 3회 재시도)
        shell: bash
        run: |
          git add data/similar_items.json
          if [ -f data/similar_axes.json ]; then git add data/similar_axes.json; fi
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "비슷한 옷 다시 만들기 — similar_items v3 (Actions)"
          for i in 1 2 3; do
            git pull --rebase origin crawl/cafe24-full-catalog && git push origin HEAD:crawl/cafe24-full-catalog && exit 0
            sleep $((i*10))
          done
          exit 1
