# 상세 이미지에서 글자를 읽는다(tesseract kor+eng). 그림으로만 설명하는 매장의 소재·사이즈를 얻는다.
# 일꾼 저장소(공개)에서 돌고, 데이터는 비공개 저장소에서 work/ 로 받아 그 안에서 작업한 뒤 되돌려 보낸다.
# 필요한 것: Settings → Secrets and variables → Actions 에 DATA_TOKEN.

name: ocr-detail-images

on:
  workflow_call:
    inputs:
      brands: {type: string, required: false, default: ""}
      max_images: {type: string, required: false, default: "3"}
      all: {type: string, required: false, default: "false"}
      shards: {type: string, required: false, default: ""}
      select: {type: string, required: false, default: "short"}
      redo: {type: string, required: false, default: "false"}
    secrets:
      DATA_TOKEN: {required: true}
  workflow_dispatch:
    inputs:
      brands:
        description: "공백으로 나눈 slug 목록. 비우면 전부"
        required: false
        default: ""
      max_images:
        description: "상품당 읽을 상세 이미지 수(앞에서부터)"
        required: false
        default: "3"
      all:
        description: "true 면 설명 길이와 무관하게 상세 이미지가 있는 상품 전부"
        required: false
        default: "false"
      shards:
        description: "(미사용 — 조각 수는 브랜드의 그림 수로 자동 결정한다)"
        required: false
        default: ""
      select:
        description: "short(설명 짧은 것) | no-size(사이즈 표 없는 옷) | gaps(사이즈·소재·색·디테일 중 하나라도 빈 옷) | ocr(그림에서 읽은 옷 다시) | bad-size(사이즈가 커지는데 값이 작아지는 표만) | capped(옛 6,000자 상한에 잘린 기록 다시) | thin-table(표 칸이 사이즈 수보다 적은 옷) | all"
        required: false
        default: "short"
      redo:
        description: "true 면 예전에 그림을 덜 읽고 끝난 상품도 다시 읽는다(사이즈 없는 것만)"
        required: false
        default: "false"

env:
  DATA_BRANCH: crawl/cafe24-full-catalog

permissions:
  contents: read

# 자물쇠를 **부르는 쪽**으로 가른다. 2026-09-17 에 정기 판(fill-gaps)의 나선 OCR 이 끝나지도
# 죽지도 않은 채 아홉 시간을 버티며 자물쇠를 쥐었고, 그동안 손으로 띄운 판은 조각 0개로
# 멈춰 있었다(취소해도 다시 in_progress 로 돌아왔다). 하나가 얼어도 다른 쪽은 돌게 한다.
# 둘이 겹쳐 돌아도 collect 의 푸시는 rebase 후 3회 재시도라 견딘다.
concurrency:
  group: ocr-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: 데이터 저장소(비공개) 받기
        uses: ./.github/actions/data-repo
        with:
          token: ${{ secrets.DATA_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 판독기가 쓰는 꾸러미(일정 짜기에도 같은 파일을 읽어 들인다)
        run: pip install -q requests pillow
      # 조각 나누기의 잣대는 **판독기 자신**이 들고 있다(ocr_detail_images --plan).
      # 예전엔 이 자리에 같은 잣대를 베낀 파이썬이 있었고, 베낀 쪽이 낡아 세 번 사고가 났다.
      # 마지막은 「상세 그림이 없으면 갤러리를 읽는다」를 판독기만 알고 여기는 몰라서,
      # 갤러리만 있는 매장 3,557벌이 통째로 빠졌는데 판은 초록으로 끝난 일이다(2026-09-15).
      # 잣대가 한 벌뿐이면 다시 어긋날 수 없다. 대상이 0이면 --plan 이 죽는다.
      - id: plan
        shell: bash
        env:
          BRANDS: ${{ inputs.brands }}
          SEL: ${{ inputs.select || 'short' }}
          MAXI: ${{ inputs.max_images }}
        run: |
          ARGS=()
          if [ -n "$BRANDS" ]; then ARGS+=(--brands $BRANDS); fi
          if [ "${{ inputs.all }}" = "true" ]; then ARGS+=(--all); fi
          if [ "${{ inputs.redo }}" = "true" ]; then ARGS+=(--redo); fi
          # 표를 노리는 판(no-size·ocr…)은 머리줄을 낱말 단위로 다시 읽어 장당 5초가 든다 —
          # 조각을 잘게 낸다. 설명글만 훑는 판은 장당 1.5초라 크게 묶어도 된다(2026-09-05).
          case "$SEL" in
            no-size|ocr|gaps|thin-table|capped) PER=250 ;;
            *) PER=700 ;;
          esac
          python3 scripts/ocr_detail_images.py --plan --per-shard "$PER" \
            --max-images "$MAXI" --select "$SEL" --procs 4 "${ARGS[@]}"

  ocr:
    needs: plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: 데이터 저장소(비공개) 받기
        uses: ./.github/actions/data-repo
        with:
          token: ${{ secrets.DATA_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: tesseract (kor+eng)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-kor
          pip install -q requests pillow
      - name: OCR ${{ matrix.brand }} ${{ matrix.shard }}/${{ matrix.shards }}
        run: |
          ALL=""; [ "${{ inputs.all }}" = "true" ] && ALL="--all"
          [ "${{ inputs.redo }}" = "true" ] && ALL="$ALL --redo"
          N="${{ matrix.shards }}"
          # 예의: 한 브랜드를 N조각으로 나누면 같은 호스트를 N군데서 두드린다. 조각마다 대기를 N배로
          # 늘려야 매장이 받는 요청이 초당 2회로 유지된다(2026-09-04, 재수집 때 20초 응답을 겪고 정리).
          D=$(python3 -c "print(0.5*$N)")
          # 공용 이미지 CDN(cafe24img)은 매장 원본 서버가 아니라 카페24가 수만 매장에 쓰는 곳이라
          # 조금 빠르게 받는다. 사이즈 없는 상품 그림의 38%(프리즘웍스는 81%)가 여기서 온다.
          C=$(python3 -c "print(0.25*$N)")
          python scripts/ocr_detail_images.py --brands "${{ matrix.brand }}" \
            --max-images "${{ inputs.max_images }}" --procs 4 --delay "$D" --cdn-delay "$C" $ALL \
            --shard "${{ matrix.shard }}/$N" --out-dir _parts --select "${{ inputs.select || 'short' }}"
      # 조각이 시간 상한에 걸려 취소되면 이 단계가 건너뛰어져, 한 줄씩 append·flush 해 둔
      # 읽은 OCR 글이 러너와 함께 통째로 버려진다(2026-09-13, 한 조각이 300분을 읽고 0을 남겼다).
      # 부분 결과도 그 자체로 온전한 기록이라 합치면 그만큼 이득이다 — 잡은 그대로 빨갛게 둔다.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-${{ matrix.brand }}-${{ matrix.shard }}
          path: work/_parts/*.jsonl
          if-no-files-found: ignore
          retention-days: 7

  collect:
    needs: ocr
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work
    steps:
      - uses: actions/checkout@v4
      - name: 데이터 저장소(비공개) 받기
        uses: ./.github/actions/data-repo
        with:
          token: ${{ secrets.DATA_TOKEN }}
      # 판독기·태거는 **이 저장소의** scripts 다(data-repo 액션이 work/scripts 를 덮어쓴다).
      # workflow_dispatch 는 그 scripts 를 **띄운 시각의 SHA 로 못박는다**. 그래서 긴 판이
      # 도는 동안 판독기를 고쳐 밀어도 그 판은 옛 코드로 재생성하고, 밖에서는 티가 안 난다.
      # 2026-09-16 에 그 꼴을 겪었다 — 254잡 여섯 시간을 읽고 collect 가 옛 판독기로 돌아,
      # 그날 밤 고친 넷(화장 1,638벌 · 튀는 칸 218 · JSONL · 소재)이 하나도 안 들어갔다.
      # 로그 한 줄로는 아무도 안 보므로 job summary 에도 적는다.
      - name: 스크립트가 최신인지 — 옛 코드로 재생성하면 조용히 틀린다
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          git fetch -q origin "${{ github.event.repository.default_branch }}"
          head=$(git rev-parse FETCH_HEAD)
          mine="${{ github.sha }}"
          if [ "$head" = "$mine" ]; then
            echo "스크립트 최신 — ${mine:0:7}"
            exit 0
          fi
          n=$(git rev-list --count "$mine..$head" 2>/dev/null || echo "?")
          {
            echo "### ⚠ 옛 스크립트로 재생성했다"
            echo ""
            echo "이 판은 \`${mine:0:7}\` 로 못박혀 있는데 기본 가지는 \`${head:0:7}\` 이다 — **커밋 $n 개 뒤처짐**."
            echo ""
            git log --oneline "$mine..$head" 2>/dev/null | sed 's/^/- /'
            echo ""
            echo "판독기를 고쳤다면 **현재 기본 가지로 한 판 더 띄워 재생성**해야 반영된다."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::스크립트가 $n 커밋 뒤처진 채로 재생성한다 (${mine:0:7} < ${head:0:7})"
      - uses: actions/download-artifact@v4
        with:
          pattern: ocr-*
          path: work/_parts
          merge-multiple: true
      - name: 조각을 data/crawl/ocr 로 합치기
        shell: bash
        run: |
          mkdir -p data/crawl/ocr
          python3 - <<'PY'
          import json, glob, os
          from collections import defaultdict
          parts = defaultdict(list)
          for p in sorted(glob.glob("_parts/*.jsonl")):
              brand = os.path.basename(p).rsplit(".", 2)[0]
              parts[brand].append(p)
          n = t = new = 0
          for brand, files in parts.items():
              dst = f"data/crawl/ocr/{brand}.jsonl"
              have = {}
              if os.path.exists(dst):
                  for l in open(dst, encoding="utf-8"):
                      if l.strip():
                          d = json.loads(l); have[d["product_no"]] = d
              for p in files:
                  for l in open(p, encoding="utf-8"):
                      if not l.strip():
                          continue
                      d = json.loads(l)
                      old = have.get(d["product_no"])
                      # 같은 상품이라도 그림을 더 읽었거나 글이 더 나온 쪽이 이긴다 — 예전엔 「이미 있으면 건너뛰기」라
                      # --redo 로 3,056장을 다시 읽고도 collect 가 「변화 없음」으로 끝났다(2026-09-04 run 3).
                      if old is None:
                          have[d["product_no"]] = d; new += 1
                      elif (len(d.get("images") or []), len(d.get("ocr_text") or "")) > \
                           (len(old.get("images") or []), len(old.get("ocr_text") or "")):
                          have[d["product_no"]] = d; new += 1
              with open(dst, "w", encoding="utf-8") as f:
                  for d in have.values():
                      f.write(json.dumps(d, ensure_ascii=False) + "\n")
              n += len(have); t += sum(1 for d in have.values() if d["ocr_text"])
          print(f"OCR 결과 상품 {n} · 글 나온 상품 {t} · 이번에 새로 {new}")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests beautifulsoup4 lxml
      - name: 사이즈 · 태그 재생성
        # 파이프로 head 에 물리면 안 된다 — 기본 셸에 pipefail 이 없어서 파이프라인의 끝인
        # head 의 성공만 보고, 파이썬이 죽어도 워크플로가 그냥 넘어간다. 실제로 그 탓에
        # size_from_ocr.py 가 2026-09-06 14:31 부터 열 시간 동안 조용히 죽어 있었고
        # data/product_sizes.json 이 07:12 판에 멈춰 있었다(2026-09-07).
        run: |
          python scripts/size_from_ocr.py > /tmp/size.log
          head -2 /tmp/size.log
          python scripts/tag_items.py > /tmp/tag.log
          head -16 /tmp/tag.log
          python scripts/size_gap_report.py || true
          python scripts/missing_report.py || true
      - name: 데이터 감사 — 지난 판과 견준다
        shell: bash
        run: |
          {
            echo "## 데이터 감사"
            echo '```'
            python scripts/audit.py || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 수집률 한 줄 (job summary)
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, csv, collections
          NEW = {"siyazu","noirer","mardi-mercredi","margesherwood","nick-nicole","sinoon","grove",
                 "vunque","loeuvre","xlim","stand-oil","osoi","koominseong","nonnod","miseki-seoul",
                 "far-from-what","aoiro","junne","haiq","espionage","roaringrad"}
          GAR = {"tops","outer","bottoms","dress","skirt","suiting"}
          sz = json.load(open("data/product_sizes.json", encoding="utf-8"))
          tg = json.load(open("data/product_tags_full.json", encoding="utf-8"))
          c = collections.Counter()
          for r in csv.DictReader(open("data/products_full.csv", encoding="utf-8-sig")):
              if r["brand_slug"] in NEW or r["status"] != "ON_SALE":
                  continue
              u = r["source_url"]; t = (tg.get(u, {}) or {}).get("tags", {}) or {}
              c["판매중"] += 1
              if r["category_code"] in GAR:
                  c["옷"] += 1
                  if (sz.get(u) or {}).get("sizes"):
                      c["사이즈"] += 1
              if t.get("material"): c["소재"] += 1
              if t.get("color"): c["색"] += 1
              if t.get("design_element") or t.get("construction") or t.get("hardware"): c["디테일"] += 1
          print("## 기존 47곳 · 판매중")
          print(f"- 사이즈 {c['사이즈']:,}/{c['옷']:,} = {c['사이즈']/max(1,c['옷'])*100:.2f}%")
          for k in ("소재", "색", "디테일"):
              print(f"- {k} {c[k]:,}/{c['판매중']:,} = {c[k]/max(1,c['판매중'])*100:.2f}%")
          PY
      - name: commit & push (rebase 후, 3회 재시도)
        shell: bash
        run: |
          git config user.name "layer-ocr-bot"
          git config user.email "ocr@layer.invalid"
          git add data/crawl/ocr/ data/product_sizes.json data/product_tags_full.json \
                  data/_issues_existing_brands.csv data/size_unavailable.csv \
                  data/_missing.csv data/_missing_existing.csv \
                  data/_audit.json data/_audit.csv 2>/dev/null || true
          git add -A data/crawl/ocr/ data/product_sizes.json data/product_tags_full.json
          git diff --cached --quiet && { echo "변화 없음"; exit 0; }
          git commit -m "OCR 결과 — $(ls data/crawl/ocr/*.jsonl | wc -l)개 브랜드 (Actions)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$DATA_BRANCH" && git push && exit 0
            # 생성물이 부딪히면 저쪽 것을 받는다 — 원본에서 다시 만들면 그만이고,
            # 여기서 멈추면 이번 수집이 통째로 날아간다.
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              # 판마다 통째로 다시 만드는 것들 — 생성물 셋과 보고 파일. 부딪히면 저쪽 것을
              # 받는다. 원본에서 다시 만들면 그만이라, 이것 때문에 수확을 버릴 이유가 없다.
              for f in $(git diff --name-only --diff-filter=U \
                         | grep -E '^data/(products_full\.csv|product_sizes\.json|product_tags_full\.json|_audit\.(json|csv)|_issues[^/]*\.csv|size_unavailable\.csv|_missing[^/]*\.csv)$|^data/crawl/_[^/]*\.json$' || true); do
                git checkout --ours -- "$f" && git add "$f"
              done
              # 수확(매장별 jsonl)이 하나라도 안 풀리면 abort — 저쪽 것으로 덮지 않는다.
              if [ -z "$(git diff --name-only --diff-filter=U)" ]; then
                git -c core.editor=true rebase --continue && git push && exit 0
              fi
              git rebase --abort 2>/dev/null || true
            fi
            echo "푸시 실패, 재시도 $i"; sleep 10
          done
          exit 1
