# ── 일꾼 저장소(공개)에서 도는 워크플로. 데이터는 비공개 저장소에 있고 매 잡마다 work/ 로 받아 와
# 그 안에서 돌린 뒤 되돌려 보낸다. 공개 저장소라 Actions 분이 무료다.
# 필요한 것: 이 저장소 Settings → Secrets and variables → Actions 에 DATA_TOKEN
# (데이터 저장소의 Contents 를 읽고 쓸 수 있는 파인그레인 토큰).
# 주간 갱신 — 신상·품절·재입고·삭제만. 매주 월요일 03:00 KST (일요일 18:00 UTC).
#
# 하는 일: 목록 스캔을 브랜드별로 러너에 흩어 돌리고(scan) → 한자리에 모아 CSV·OCR·태그·사이즈를
# 다시 만들어 커밋한다(collect). 설명·소재 변경은 쫓지 않는다(사람 결정 2026-09-02).
#
# 왜 나누나: PoliteSession 은 매장 호스트마다 초당 한 번이다. 한 러너에서 12스레드로 돌리면
# 브랜드 68곳이 여섯 물결로 나뉘어 5시간이 넘고, 300분 제한에 걸려 두 번 연속 통째로 취소됐다
# (9/6 · 9/9). 한 브랜드는 반드시 한 러너 안에만 둔다 — 그래야 그 매장에 초당 한 번이 지켜진다.
# 묶음 스무 개면 브랜드가 거의 한 물결에 들어가 가장 느린 브랜드 시간이면 끝난다(2026-09-10).

name: weekly-update

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      brands:
        description: "공백으로 나눈 slug 목록. 비우면 전부"
        required: false
        default: ""
      buckets:
        description: "러너(묶음) 수 — 계정 동시 실행 한도 20"
        required: false
        default: "20"
      max_brands:
        description: "묶음 하나에 담을 브랜드 수 상한(한 러너가 동시에 보는 매장 수)"
        required: false
        default: "6"

env:
  DATA_BRANCH: crawl/cafe24-full-catalog

permissions:
  contents: read
  actions: write   # 이 판의 아티팩트를 지운다

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: 데이터 저장소(비공개) 받기
        uses: ./.github/actions/data-repo
        with:
          token: ${{ secrets.DATA_TOKEN }}
      - id: plan
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv, collections, json, os, sys
          want = "${{ inputs.brands }}".split()
          cnt = collections.Counter()
          for r in csv.DictReader(open("data/products_full.csv", encoding="utf-8-sig")):
              cnt[r["brand_slug"]] += 1
          for p in os.listdir("data/crawl"):          # 목록에 없던 새 브랜드도 센다
              if p.endswith(".jsonl") and not p.startswith("_"):
                  cnt.setdefault(p[:-6], 0)
          brands = [(b, n) for b, n in sorted(cnt.items(), key=lambda x: -x[1]) if not want or b in want]
          buckets = max(1, int("${{ inputs.buckets }}" or 20))
          maxb = max(1, int("${{ inputs.max_brands }}" or 6))
          groups = [[] for _ in range(buckets)]; load = [0] * buckets
          for b, n in brands:                          # 한 브랜드는 한 묶음에만 — 매장당 초당 1회를 지키려고
              cand = [j for j in range(buckets) if len(groups[j]) < maxb] or list(range(buckets))
              i = min(cand, key=lambda j: (load[j], len(groups[j])))
              groups[i].append(b); load[i] += n
          inc = [{"bucket": i + 1, "brands": " ".join(g), "load": load[i]}
                 for i, g in enumerate(groups) if g]
          print("matrix=" + json.dumps({"include": inc}))
          print(f"브랜드 {len(brands)} → 묶음 {len(inc)} · 묶음별 상품 수 {sorted(load, reverse=True)}", file=sys.stderr)
          PY

  scan:
    needs: plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work
    # 110분은 매장이 68곳이던 때(2026-09-10) 값이다. 약 210곳을 20묶음에 나누니 묶음마다 10곳 안팎이 되고,
    # 상품 페이지를 한 쪽씩 여는 매장(식스샵·crawl_pages)이 늘어 2026-09-28 판에서 묶음 넷이 110분에 걸려
    # 취소됐다(묶음 8 은 카페24 만인데도). 러너 한 대 상한 6시간보다 한참 아래인 170분으로 올린다.
    # 2026-10-02 할인가를 받기 시작하자 판매중 상세를 7일마다 다시 읽게 되어(STALE_PRICE_DAYS) 첫 판은 거의 모든 상세를 다시 연다 —
    # 묶음 4 · 7 · 8(eenk · margarin · drawfit · we11done · kirsh · etmon …)이 두 판 연속 170분에 걸렸다. 330분(러너 상한 360).
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: 데이터 저장소(비공개) 받기
        uses: ./.github/actions/data-repo
        with:
          token: ${{ secrets.DATA_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests beautifulsoup4 lxml numpy
      - name: 묶음 ${{ matrix.bucket }} 목록 스캔 (상품 ${{ matrix.load }})
        # 로그는 이 판에 **새로 붙은 줄만** 넘긴다. 예전엔 파일 통째로 넘겨, 묶음 20개가 저마다
        # 옛 로그 전부를 collect 에 다시 붙였다 — 판마다 20배로 불어 2026-10-03 에 402MB 가 되어
        # 푸시가 GitHub 100MB 상한에 막혔다(고유한 줄은 478개뿐이었다).
        run: |
          (wc -l < data/crawl/_weekly_log.jsonl 2>/dev/null || echo 0) > _log_base
          python scripts/weekly_update.py --brands ${{ matrix.brands }} --workers 8 --no-csv
      # 스캔이 시간 상한에 걸려 취소되면 이 단계와 업로드가 건너뛰어져, **이미 끝난 매장**의
      # 갱신까지 러너와 함께 버려진다(2026-09-13 에 OCR 조각이 그래서 5시간을 읽고 0을 남겼다).
      # 매장은 하나씩 마무리되고, 목록이 덜 걷힌 매장은 weekly_update 의 가드레일이 상태 변경을
      # 보류하므로(「목록 N < 판매중 M×비율」), 덜 끝난 판의 결과를 합쳐도 품절·삭제가 번지지 않는다.
      - name: 이 묶음이 맡은 파일만 골라 담기
        if: always()
        shell: bash
        run: |
          mkdir -p _parts
          for b in ${{ matrix.brands }}; do
            cp "data/crawl/$b.jsonl" _parts/ 2>/dev/null || echo "  $b 파일 없음"
          done
          if [ -f data/crawl/_weekly_log.jsonl ]; then
            tail -n +$(( $(cat _log_base 2>/dev/null || echo 0) + 1 )) data/crawl/_weekly_log.jsonl \
              > "_parts/_weekly_log.b${{ matrix.bucket }}.log"
          fi
          ls _parts | wc -l
      # 공개 저장소라 아티팩트는 누구나 받는다 — 잠가서 올리고 합치는 잡에서 푼다(2026-10-04).
      - name: 조각 잠그기
        if: always()
        uses: ./.github/actions/parts-lock
        with:
          mode: lock
          dir: work/_parts
          files: "*"
          out: _enc/weekly-b${{ matrix.bucket }}.enc
          key: ${{ secrets.DATA_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-b${{ matrix.bucket }}
          path: _enc/*.enc
          if-no-files-found: ignore
          retention-days: 1

  collect:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: 데이터 저장소(비공개) 받기
        uses: ./.github/actions/data-repo
        with:
          token: ${{ secrets.DATA_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps (requests · bs4 · lxml · tesseract kor)
        run: |
          # pillow 를 빼먹어 신상 OCR 이 ModuleNotFoundError 로 죽었고, 그 뒤 태그·사이즈
          # 재생성과 커밋이 통째로 건너뛰어졌다 — 스캔 20갈래 1시간 35분이 커밋 없이 날아갔다
          # (2026-09-12 run 34681341194). ocr.yml 은 pillow 를 깔고 있었다.
          pip install -q requests beautifulsoup4 lxml pillow numpy
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-kor
      - uses: actions/download-artifact@v4
        with:
          pattern: weekly-*
          path: work/_parts
          merge-multiple: true
      - name: 조각 풀기
        uses: ./.github/actions/parts-lock
        with:
          mode: unlock
          dir: work/_parts
          key: ${{ secrets.DATA_TOKEN }}
      - name: 조각을 본 파일에 올리기
        shell: bash
        run: |
          shopt -s nullglob
          n=0
          for f in _parts/*.jsonl; do cp "$f" data/crawl/ ; n=$((n+1)); done
          for f in _parts/_weekly_log.b*.log; do cat "$f" >> data/crawl/_weekly_log.jsonl ; done
          # 같은 줄이 겹쳐 붙어도 한 번만 남긴다(순서는 그대로).
          if [ -f data/crawl/_weekly_log.jsonl ]; then
            awk '!seen[$0]++' data/crawl/_weekly_log.jsonl > _log.tmp && mv _log.tmp data/crawl/_weekly_log.jsonl
            wc -lc data/crawl/_weekly_log.jsonl
          fi
          echo "브랜드 파일 $n개 올림"
      - name: CSV 다시 만들기
        run: python scripts/weekly_update.py --csv-only
      - name: 신상 OCR (설명 짧은 것만, 이미 한 상품은 건너뜀)
        # OCR 은 있으면 좋은 것이지 이 갱신의 뼈대가 아니다. 여기서 죽는다고 스캔 결과를
        # 통째로 버리면 안 된다 — 실제로 한 번 그랬다(2026-09-12).
        continue-on-error: true
        # 단계 상한 — 없으면 이 단계가 잡 상한(200분)을 다 먹고 뒤의 재생성 · 커밋이 통째로 날아간다.
        # 2026-10-02 run 36984119480: 할인가를 받느라 상세를 거의 다 다시 읽은 판에서 신상 OCR 이 3시간을 넘겨
        # 스캔 결과(할인가 · 품절)가 커밋되지 못했다. OCR 은 ocr.yml 이 따로 돈다 — 여기서는 남는 시간만 쓴다.
        timeout-minutes: 45
        run: python scripts/ocr_detail_images.py --max-images 3 --procs 2
      - name: 태그 재생성
        # head 로 파이프하면 파이썬이 죽어도 워크플로가 넘어간다(pipefail 없음)
        run: |
          python scripts/tag_items.py > /tmp/tag.log
          head -20 /tmp/tag.log
      - name: 사이즈 재생성 (실측 표 → product_sizes.json)
        run: |
          python scripts/size_from_ocr.py > /tmp/size.log
          python scripts/photo_fill.py | tail -4   # 사진으로 소매 · 넥라인 채우기(확신 ≥0.8, 2026-10-05)
          python scripts/refine_items.py | tail -2   # 소매 실측 · 태그로 반팔 · 롱슬리브 · 하프셔츠 다듬기(2026-10-05)
          tail -3 /tmp/size.log
      - name: 스타일 묶기 (색상 행 → style_id)
        # 있으면 좋은 것 — 여기서 죽어도 수집 결과는 커밋한다
        continue-on-error: true
        timeout-minutes: 20
        run: python scripts/build_styles.py
      - name: commit & push (rebase 후, 3회 재시도)
        shell: bash
        run: |
          git config user.name "layer-weekly-bot"
          git config user.email "weekly@layer.invalid"
          git add data/crawl/ data/products_full.csv data/product_sizes.json data/product_tags_full.json
          for f in data/styles.csv data/styles_stats.json data/gender_basis.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet && { echo "변화 없음"; exit 0; }
          git commit -m "주간 갱신 $(date -u +%Y-%m-%d) — 신상·품절·재입고·삭제 (Actions)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$DATA_BRANCH" && git push && exit 0
            # 생성물이 부딪히면 저쪽 것을 받는다 — 원본에서 다시 만들면 그만이고,
            # 여기서 멈추면 이번 수집이 통째로 날아간다.
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              # 판마다 통째로 다시 만드는 것들 — 생성물 셋과 보고 파일. 부딪히면 저쪽 것을
              # 받는다. 원본에서 다시 만들면 그만이라, 이것 때문에 수확을 버릴 이유가 없다.
              for f in $(git diff --name-only --diff-filter=U \
                         | grep -E '^data/(products_full\.csv|product_sizes\.json|product_tags_full\.json|styles\.csv|styles_stats\.json|gender_basis\.json|_audit\.(json|csv)|_issues[^/]*\.csv|size_unavailable\.csv|_missing[^/]*\.csv)$|^data/crawl/_[^/]*\.json$' || true); do
                git checkout --ours -- "$f" && git add "$f"
              done
              # 주간 판도 신상을 OCR 로 읽어 data/crawl/ocr/ 에 쓴다. 같은 매장을 OCR 판이 먼저 밀면
              # 그 jsonl 이 부딪힌다 — ocr.yml 처럼 **내용으로 합친다**(한 줄이 한 상품, 더 읽은 쪽이 이긴다).
              # 2026-09-28 주간 판이 새 매장 넷(concepts1one·doucan·insane-garage·merely-made)의 OCR
              # add/add 충돌로 세 번 다 못 밀고 끝났다 — 전 매장 값·재고 갱신이 통째로 날아갔다.
              python3 scripts/resolve_ocr_conflicts.py || true
              # 수확(매장별 jsonl)이 하나라도 안 풀리면 abort — 저쪽 것으로 덮지 않는다.
              if [ -z "$(git diff --name-only --diff-filter=U)" ]; then
                git -c core.editor=true rebase --continue && git push && exit 0
              fi
              git rebase --abort 2>/dev/null || true
            fi
            echo "푸시 실패, 재시도 $i"; sleep 10
          done
          exit 1
      # 잠근 조각이라도 남겨 둘 까닭이 없다 — 합쳐 밀고 나면 이 판의 아티팩트를 지운다.
      # (실패한 판은 다시 돌릴 수 있게 남기고, 하루 뒤 저절로 사라진다.)
      - name: 이 판의 조각(아티팩트) 지우기
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" >/dev/null && echo "지움 $id"; done
