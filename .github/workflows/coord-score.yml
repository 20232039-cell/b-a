name: LAYER recommendation comparisons
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Comparison dataset
        required: true
        type: choice
        options: [similar, outfit, review]
permissions:
  contents: read
concurrency:
  group: layer-credit-20261122-${{ inputs.phase }}
  cancel-in-progress: false
jobs:
  compare:
    if: github.ref == 'refs/heads/codex/layer-rank-credit-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Prepare private catalog
        uses: ./.github/actions/data-repo
        with:
          token: ${{ secrets.DATA_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests pillow
      - name: Compare and checkpoint private results
        working-directory: work
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PHASE: ${{ inputs.phase }}
        run: python -u scripts/rank_comparisons.py "$PHASE"
