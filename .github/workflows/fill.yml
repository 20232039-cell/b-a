# 채우기 한 바퀴 — 소재·디테일·색·사이즈가 빈 옷을 「HTML 먼저, 그러고도 없으면 그림」 순서로 채운다.
# 사람 지시(2026-09-05): 「html에 소재 디테일 있으면 그걸로 끝. 만약 없으면 이미지 받아서 찾고
# 이런방식으로 계속 돌리면 될거같은데. 아 사이즈도 계속수집해야되고」
#
# 한 바퀴 = ① 상세 다시 열기(refetch, select=gaps) → ② 그림 읽기(ocr, select=gaps) → 각 판이
# 끝나며 사이즈·태그를 다시 뽑고 커밋한다. ②는 ①이 끝난 뒤에 도므로, HTML 로 채워진 상품은
# 그림 대상에서 저절로 빠진다(gaps 는 매번 그때의 결과 파일을 보고 다시 센다).
#
# 4시간마다. 대상이 없으면 plan 이 빈 행렬을 내고 잡이 0개로 끝나므로 헛돌지 않는다.
# 러너 시간: 공개 저장소라 무료.

name: fill-gaps

on:
  schedule:
    - cron: "20 */4 * * *"
  workflow_dispatch:
    inputs:
      skip_html:
        description: "true 면 상세 다시 열기를 건너뛰고 그림만 읽는다"
        required: false
        default: "false"

concurrency:
  group: fill-gaps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  html:
    if: inputs.skip_html != 'true'
    uses: ./.github/workflows/refetch.yml
    with:
      brands: all
      fields: "size,text"
      select: gaps
      max_minutes: "40"
    secrets: inherit

  images:
    needs: [html]
    if: always() && !cancelled()
    uses: ./.github/workflows/ocr.yml
    with:
      select: gaps
      max_images: "8"
      redo: "true"
    secrets: inherit
