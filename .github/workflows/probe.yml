# 매장 페이지 한 장을 받아 「가격이 어느 자리에 있는지」만 찍어 본다.
# 수집기가 상품을 버릴 때(no-price 등) 원인을 보려고 만든 도구다 — 데이터 저장소는 건드리지 않는다.
name: probe-page

on:
  workflow_dispatch:
    inputs:
      url:
        description: "상품 페이지 주소"
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q requests beautifulsoup4 lxml
      - name: 가격 자리 찍기
        run: |
          python - <<'PY'
          import os, re, json, requests
          from bs4 import BeautifulSoup
          url = os.environ["URL"]
          r = requests.get(url, timeout=30, headers={
              "User-Agent": "LAYER-bot (data quality check; contact via shop inquiry)"})
          h = r.text
          print("status", r.status_code, "bytes", len(h), "ctype", r.headers.get("content-type", "")[:40])
          if "<urlset" in h[:2000] or "<sitemapindex" in h[:2000] or url.endswith(".xml"):
              locs = re.findall(r"<loc>\s*([^<]+?)\s*</loc>", h)
              print("사이트맵 <loc> 수:", len(locs))
              prod = [u for u in locs if "/product/" in u]
              print("그중 /product/ :", len(prod))
              for u in prod[:12]:
                  print("   ", u)
              for u in locs[:8] if not prod else []:
                  print("   (상품 아님)", u)
              raise SystemExit
          soup = BeautifulSoup(h, "lxml")
          cates = sorted({int(x) for x in re.findall(r"cate_no=(\d{1,5})", h)})
          prods = sorted({m for m in re.findall(r'href="(/product/[^"]{3,120})"', h)})
          print("cate_no 후보:", cates[:40], "총", len(cates))
          print("/product/ 링크:", len(prods))
          for u in prods[:10]:
              print("   ", u)
          for var in ("product_price", "product_sale_price", "product_custom_price"):
              m = re.search(var + r"\s*=\s*['\"]?([\d.]*)", h)
              print(f"JS {var}:", m.group(1) if m else "없음")
          for s in soup.select('script[type="application/ld+json"]'):
              t = s.get_text()[:400]
              if "offers" in t or "price" in t:
                  print("LD:", re.sub(r"\s+", " ", t)[:300])
          for sel in ("#span_product_price_text", "#span_product_price_sale",
                      "#span_product_price_custom", ".price", ".product-price", "[id*=price]"):
              for el in soup.select(sel)[:3]:
                  txt = re.sub(r"\s+", " ", el.get_text(" ", strip=True))[:60]
                  if txt:
                      print(f"{sel} → {el.get('id') or el.get('class')} : {txt}")
          hits = [re.sub(r"\s+", " ", m) for m in re.findall(r"[^>]{0,60}\d{1,3},\d{3}\s*원[^<]{0,20}", h)][:8]
          print("본문에서 「원」이 붙은 자리:", json.dumps(hits, ensure_ascii=False)[:600])
          # 페이지가 무엇을 담고 있는지 — 값을 못 찾을 때 「빈 껍데기인지 자바스크립트로 그리는지」를 가른다
          print("title:", (soup.title.get_text(strip=True) if soup.title else "")[:120])
          for sel in ('meta[property="og:title"]', 'input[name="product_name"]',
                      ".headingArea h2", ".infoArea h2", "h1", "h2"):
              for el in soup.select(sel)[:2]:
                  t = (el.get("content") or el.get("value") or el.get_text(" ", strip=True) or "")[:80]
                  if t.strip():
                      print(f"   {sel} : {t}")
          print("iProductNo:", (re.search(r"iProductNo\s*=\s*(\d+)", h) or ["", "없음"])[1])
          print("script 안 상품 자료 흔적:", {k: h.count(k) for k in
                ("product_no", "product_name", "__NEXT_DATA__", "window.__", "/api/", "ajax", "EC_")
                if h.count(k)})
          for t in soup.select("script"):
              src = t.get("src") or ""
              if any(w in src for w in ("product", "detail", "app", "main")):
                  print("   script src:", src[:110])
          body = re.sub(r"\s+", " ", soup.get_text(" ", strip=True))
          print("본문 글 길이:", len(body))
          print("본문 앞머리:", body[:700])
          PY
        env:
          URL: ${{ inputs.url }}
