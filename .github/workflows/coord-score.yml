name: LAYER recommendation comparisons
run-name: LAYER credit · ${{ inputs.phase }}
on:
  workflow_dispatch:
    inputs:
      phase:
        description: Comparison dataset
        required: true
        type: choice
        options: [similar, outfit, review, monitor]
permissions:
  contents: read
concurrency:
  group: layer-credit-20261122-${{ inputs.phase }}
  cancel-in-progress: false
jobs:
  compare:
    if: github.ref == 'refs/heads/codex/layer-rank-credit-20261122' && inputs.phase != 'monitor'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Prepare private catalog
        uses: ./.github/actions/data-repo
        with:
          token: ${{ secrets.DATA_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests pillow
      - name: Compare and checkpoint private results
        working-directory: work
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PHASE: ${{ inputs.phase }}
        run: python -u scripts/rank_comparisons.py "$PHASE"
  monitor:
    if: github.ref == 'refs/heads/codex/layer-rank-credit-20261122' && inputs.phase == 'monitor'
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Follow paid comparisons through the Seoul deadline
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          JOB_TOKEN: ${{ github.token }}
        run: python -u scripts/monitor_rank_credit.py
